<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Maintenance en cours</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #163344; background: radial-gradient(ellipse at 90% 5%, #c6f1ea 0, transparent 50%), linear-gradient(135deg, #eef5ff, #f8fafb 65%); }
        main { width: min(100%, 720px); padding: clamp(36px, 8vw, 80px) 24px; border: 1px solid #fff; border-radius: 24px; background: #ffffffed; box-shadow: 0 24px 70px #1633440d; text-align: center; }
        h1 { margin: 0; font: 500 clamp(30px, 6vw, 48px)/1.2 Georgia, serif; letter-spacing: -.03em; }
    </style>
</head>
<body data-cofrac-maintenance="true">
<main>
    <h1>Maintenance en cours</h1>
</main>
</body>
</html>
